<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>灵矽 Client</title>
<style>
:root{color-scheme:dark;--bg:#111318;--panel:#1b1f27;--line:#303744;--muted:#9da7b6;--accent:#77a9ff;--good:#67d391;--warn:#ffc46b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#26324b 0,#111318 40%);font:15px -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;color:#f2f5fa;min-height:100vh}
main{max-width:1080px;margin:auto;padding:36px 22px 60px}.top{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}.eyebrow{color:var(--accent);font-size:12px;letter-spacing:.15em;text-transform:uppercase}.title{font-size:32px;font-weight:750;margin:6px 0}.sub{color:var(--muted);margin:0}.grid{display:grid;grid-template-columns:280px 1fr;gap:16px}.panel{background:rgba(27,31,39,.88);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 10px 35px #0003}.status{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:650;margin-bottom:18px}.dot{width:11px;height:11px;border-radius:50%;background:var(--good);box-shadow:0 0 14px var(--good)}.facts{display:grid;gap:11px}.fact{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:13px}.fact b{color:#f2f5fa;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.actions{display:grid;gap:9px;margin-top:22px}button{border:1px solid var(--line);border-radius:10px;background:#242b36;color:#f5f7fb;padding:10px 12px;font:inherit;cursor:pointer}button:hover{border-color:var(--accent);background:#2a3850}.primary{background:#3971d5;border-color:#5389ec}.danger{color:#ffb1ad}button:disabled{opacity:.5;cursor:default}.composer{display:flex;gap:9px;margin-bottom:15px}.composer input{flex:1;min-width:0;background:#11151c;color:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit}.feed{height:440px;overflow:auto;display:flex;flex-direction:column;gap:9px;padding-right:4px}.empty{color:var(--muted);text-align:center;margin:auto}.event{border-left:3px solid var(--line);padding:8px 11px;background:#171b22;border-radius:0 9px 9px 0}.event.stt{border-color:#c58aff}.event.tts{border-color:var(--accent)}.event.state{border-color:var(--good)}.meta{color:var(--muted);font-size:11px;margin-bottom:3px}.event p{margin:0;line-height:1.5;white-space:pre-wrap}.event pre{margin:6px 0 0;font-size:11px;color:var(--muted);white-space:pre-wrap;word-break:break-all}.event summary{cursor:pointer;color:var(--muted);font-size:11px;margin-top:4px}.reg{margin:14px 0 0;border:1px solid var(--line);border-radius:10px;padding:10px 12px}.reg summary{cursor:pointer;font-size:13px}.reg input{width:100%;box-sizing:border-box;margin:6px 0;background:#11151c;color:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:12px}.reg button{width:100%}.hint{color:var(--muted);font-size:12px;margin-top:12px}.embed .top{display:none}.embed main{max-width:none;padding:12px}.embed .feed{height:calc(100vh - 210px)}@media(max-width:720px){main{padding:24px 14px}.top{display:block}.grid{grid-template-columns:1fr}.feed{height:360px}.embed .feed{height:calc(100vh - 330px)}}
</style></head>
<body><main>
<header class="top"><div><div class="eyebrow">Open Anywhere · Linx Client</div><div class="title">灵矽本地控制台</div><p class="sub">实时查看会话、字幕和设备事件</p></div><div id="clock" class="sub"></div></header>
<section class="grid"><aside class="panel"><div class="status"><span class="dot" id="dot"></span><span id="state">连接中</span></div><div class="facts"><div class="fact">模式 <b id="mode">—</b></div><div class="fact">会话 <b id="session">—</b></div><div class="fact">设备 <b id="mac">—</b></div></div><details id="reg" class="reg"><summary id="regsum">设备注册</summary><p class="hint" id="regmsg">未注册。点“获取激活码”，在灵矽控制台绑定后再点一次检查；或填写 Agent ID 与 API Key 自动绑定。</p><input id="agent" placeholder="Agent ID（可选）" autocomplete="off"><input id="apikey" type="password" placeholder="API Key（可选，不会保存）" autocomplete="off"><button class="primary" id="doreg">获取激活码 / 检查绑定</button></details><div class="actions"><button class="primary" id="pause">暂停监听</button><button id="resume">继续监听</button><button class="danger" id="abort">打断当前回复</button><button class="primary" id="reconnect">一键断开重连</button><button id="disconnect">仅断开连接</button><label class="fact" style="margin-top:4px">播放音量 <b id="volv">100%</b></label><input type="range" id="vol" min="0" max="100" value="100"><button id="mic">开启网页麦克风</button><button id="play">开启语音播放</button></div><p class="hint">网页麦克风和语音播放由浏览器 WebCodecs 编解码 Opus，需 Chrome 或 Edge，且通过 localhost 或 HTTPS 访问。</p></aside>
<section class="panel"><div class="composer"><input id="text" placeholder="让灵矽说一句话…" autocomplete="off"><button class="primary" id="announce">主动播报</button><button id="say">发送</button></div><div class="feed" id="feed"><div class="empty">等待灵矽事件…</div></div></section></section>
</main><script>
const $=id=>document.getElementById(id),feed=$("feed");const BASE=location.pathname.replace(/\/+$/,'');if(new URLSearchParams(location.search).get('embed')==='1')document.body.classList.add('embed');
const labels={connecting:"连接中",listening:"收听中",thinking:"思考中",speaking:"播报中",idle:"已暂停",reconnecting:"重连中",disconnected:"已断开"};
function add(e){if(feed.querySelector('.empty'))feed.innerHTML='';const el=document.createElement('article');el.className='event '+(e.type||'');const title={stt:'用户',tts:'灵矽',llm:'模型',mcp:'MCP',audio:'音频',close:'连接',custom:'事件'}[e.type]||e.type||'事件';let text=e.text||e.state||(e.error||'');el.innerHTML='<div class="meta">'+title+' · '+new Date().toLocaleTimeString()+'</div><p>'+esc(e.type==='mcp'?'平台调用端侧 MCP：'+text+'（本 client 上报 0 个工具）':text)+'</p>'+(e.raw?'<details><summary>原始消息</summary><pre>'+esc(JSON.stringify(e.raw,null,1))+'</pre></details>':'');feed.append(el);feed.scrollTop=feed.scrollHeight}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
async function status(){try{const r=await fetch(BASE+'/status');const x=await r.json();$('state').textContent=labels[x.state]||x.state;$('mode').textContent=x.mode||'—';$('session').textContent=x.session_id||'—';$('mac').textContent=x.mac||'—';regView(x);if(x.volume!==undefined&&document.activeElement!==$('vol'))setVol(x.volume);const dc=x.connected?'var(--good)':'var(--warn)';$('dot').style.background=dc;$('dot').style.boxShadow='0 0 14px '+dc;$('disconnect').disabled=!x.connected;}catch(e){$('state').textContent='控制台断开'}}
async function post(path,body){const r=await fetch(BASE+path,{method:'POST',headers:{'content-type':'application/json'},body:body?JSON.stringify(body):undefined});if(!r.ok)add({type:'error',text:await r.text()});return r}
$("announce").onclick=()=>{const v=$("text").value.trim();if(v)post('/announce',{text:v}).then(()=>$("text").value='')};$("say").onclick=()=>{const v=$("text").value.trim();if(v)post('/say',{text:v}).then(()=>$("text").value='')};$("text").onkeydown=e=>{if(e.key==='Enter')$("announce").click()};$("pause").onclick=()=>post('/pause');$("resume").onclick=()=>post('/resume');$("abort").onclick=()=>post('/abort');
function regView(x){const d=$('reg');if(x.registered){$('regsum').textContent='设备已注册';$('regmsg').textContent='设备 '+x.mac+' 已注册并保存凭证。';$('doreg').style.display=$('agent').style.display=$('apikey').style.display='none'}else{$('regsum').textContent='设备未注册';if(!d.dataset.touched)d.open=true;if(x.activation_code)$('regmsg').textContent='激活码 '+x.activation_code+'。请在灵矽控制台把它绑定到智能体，然后点下方按钮检查。'}}
$('reg').addEventListener('toggle',()=>{$('reg').dataset.touched=1});
$("doreg").onclick=async()=>{const b=$("doreg");b.disabled=true;b.textContent='处理中…';try{const r=await fetch(BASE+'/device/register',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({agent_id:$('agent').value,api_key:$('apikey').value})});const x=await r.json().catch(()=>({error:'响应无法解析'}));if(x.code)$('regmsg').textContent='激活码 '+x.code+'（设备 '+x.mac+'）。请在灵矽控制台绑定后再点检查。';if(x.error)add({type:'error',text:'注册失败：'+x.error});else if(x.status==='registered')add({type:'hello',text:'设备已注册并连接'});$('apikey').value=''}finally{b.disabled=false;b.textContent='获取激活码 / 检查绑定';status()}};$("disconnect").onclick=()=>post('/disconnect').then(()=>status());$("reconnect").onclick=async()=>{const b=$("reconnect");b.disabled=true;b.textContent='连接中…';try{await post('/reconnect')}finally{b.disabled=false;b.textContent='一键断开重连';status()}};
const wsBase=(location.protocol==='https:'?'wss://':'ws://')+location.host+BASE;
let micStream=null,micCtx=null,processor=null,audioSocket=null,encoder=null,micTs=0,micBuf=new Float32Array(0);
const FRAME=960;
function stopMic(){micStream?.getTracks().forEach(t=>t.stop());processor?.disconnect();micCtx?.close();audioSocket?.close();try{encoder?.close()}catch{}micStream=micCtx=processor=audioSocket=encoder=null;$("mic").textContent='开启网页麦克风'}
$("mic").onclick=async()=>{if(micStream){stopMic();return}
if(!('AudioEncoder' in window)){add({type:'error',text:'浏览器不支持 WebCodecs，请使用 Chrome 或 Edge'});return}
try{startPlayback();micStream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}});
micCtx=new AudioContext({sampleRate:16000});audioSocket=new WebSocket(wsBase+'/audio?codec=opus');audioSocket.binaryType='arraybuffer';
audioSocket.onclose=()=>{if(micStream)stopMic()};
encoder=new AudioEncoder({output:c=>{if(audioSocket?.readyState===1){const b=new Uint8Array(c.byteLength);c.copyTo(b);audioSocket.send(b)}},error:e=>add({type:'error',text:'编码失败：'+e.message})});
encoder.configure({codec:'opus',sampleRate:16000,numberOfChannels:1,bitrate:24000,opus:{frameDuration:60000,application:'voip'}});
const src=micCtx.createMediaStreamSource(micStream);processor=micCtx.createScriptProcessor(4096,1,1);micTs=0;micBuf=new Float32Array(0);
processor.onaudioprocess=e=>{const inp=e.inputBuffer.getChannelData(0);const m=new Float32Array(micBuf.length+inp.length);m.set(micBuf);m.set(inp,micBuf.length);let o=0;
while(m.length-o>=FRAME&&encoder?.state==='configured'){const f=m.slice(o,o+FRAME);o+=FRAME;encoder.encode(new AudioData({format:'f32-planar',sampleRate:16000,numberOfFrames:FRAME,numberOfChannels:1,timestamp:micTs,data:f}));micTs+=60000}
micBuf=m.slice(o)};
src.connect(processor);processor.connect(micCtx.destination);$("mic").textContent='关闭网页麦克风'}catch(e){stopMic();add({type:'error',text:'麦克风不可用：'+e})}};
let playGain=null,playCtx=null,playSocket=null,decoder=null,playAt=0,playTs=0,playing=[];
function flushPlayback(){playing.forEach(s=>{try{s.stop()}catch{}});playing=[];playAt=0}
function startPlayback(){if(playSocket)return;if(!('AudioDecoder' in window)){add({type:'error',text:'浏览器不支持 WebCodecs，无法播放语音'});return}
playCtx=new AudioContext();playCtx.resume();playGain=playCtx.createGain();playGain.gain.value=($('vol').value||100)/100;playGain.connect(playCtx.destination);playSocket=new WebSocket(wsBase+'/playback');playSocket.binaryType='arraybuffer';
playSocket.onclose=()=>{playSocket=null;try{decoder?.close()}catch{}decoder=null;$("play").textContent='开启语音播放'};
playSocket.onmessage=ev=>{if(typeof ev.data==='string'){const rate=JSON.parse(ev.data).sample_rate||16000;
decoder=new AudioDecoder({output:d=>{const buf=playCtx.createBuffer(1,d.numberOfFrames,d.sampleRate);const ch=new Float32Array(d.numberOfFrames);d.copyTo(ch,{planeIndex:0,format:'f32-planar'});buf.copyToChannel(ch,0);d.close();
const s=playCtx.createBufferSource();s.buffer=buf;s.connect(playGain);const t=Math.max(playCtx.currentTime+0.05,playAt);s.start(t);playAt=t+buf.duration;playing.push(s);s.onended=()=>{playing=playing.filter(x=>x!==s)}},error:e=>add({type:'error',text:'解码失败：'+e.message})});
decoder.configure({codec:'opus',sampleRate:rate,numberOfChannels:1});return}
if(decoder?.state==='configured'){decoder.decode(new EncodedAudioChunk({type:'key',timestamp:playTs,data:ev.data}));playTs+=60000}};
$("play").textContent='关闭语音播放'}
$("play").onclick=()=>{if(playSocket){playSocket.close();flushPlayback();playCtx?.close();playCtx=null}else startPlayback()};
$("abort").addEventListener('click',flushPlayback);function setVol(v){$('vol').value=v;$('volv').textContent=v+'%';if(playGain)playGain.gain.value=v/100}$('vol').oninput=()=>setVol(+$('vol').value);
new EventSource(BASE+'/events').onmessage=e=>{try{const x=JSON.parse(e.data);if(x.type==='audio')return;if(x.type==='volume'){setVol(+x.text);add({type:'volume',text:'灵矽调节音量为 '+x.text+'%'});return}if(x.type==='tts'&&x.is_aborted)flushPlayback();add(x);status()}catch{}};status();setInterval(status,3000);setInterval(()=>$("clock").textContent=new Date().toLocaleTimeString(),1000);
</script></body></html>
