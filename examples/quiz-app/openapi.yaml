openapi: 3.1.0
info:
  title: Open Anywhere Quiz App
  version: 0.1.0
  description: |
    A standalone multiplayer quiz application. The public application API
    only uses generic user_id values. How a caller identifies a user is
    outside this application and may be voice, account, button, or another adapter.
servers:
  - url: http://127.0.0.1:38120
    description: Local Node server
paths:
  /api/sessions/{session_id}/state:
    get:
      operationId: getGameState
      summary: Get current game state
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          $ref: '#/components/responses/AppResponse'
  /api/sessions/{session_id}/players:
    post:
      operationId: registerPlayer
      summary: Register a player
      description: Register a player using a generic user_id supplied by the caller.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPlayerRequest'
      responses:
        '200':
          $ref: '#/components/responses/AppResponse'
  /api/sessions/{session_id}/players/{player_id}/ready:
    post:
      operationId: playerReady
      summary: Mark a player ready
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/PlayerId'
      responses:
        '200':
          $ref: '#/components/responses/AppResponse'
  /api/sessions/{session_id}/start:
    post:
      operationId: startGame
      summary: Start the game
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          $ref: '#/components/responses/QuestionResponse'
  /api/sessions/{session_id}/answers:
    post:
      operationId: submitAnswer
      summary: Submit a player's answer
      description: The caller resolves the speaker to user_id before calling this application API.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAnswerRequest'
      responses:
        '200':
          $ref: '#/components/responses/AnswerResponse'
  /api/sessions/{session_id}/answers/{answer_id}/evaluate:
    post:
      operationId: evaluateAnswer
      summary: Commit the answer judgement
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: answer_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateAnswerRequest'
      responses:
        '200':
          $ref: '#/components/responses/AppResponse'
  /api/sessions/{session_id}/pause:
    post:
      operationId: pauseGame
      summary: Pause the game
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          $ref: '#/components/responses/AppResponse'
  /api/sessions/{session_id}/resume:
    post:
      operationId: resumeGame
      summary: Resume the game
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          $ref: '#/components/responses/AppResponse'
  /api/sessions/{session_id}/reset:
    post:
      operationId: resetGame
      summary: Reset the game
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          $ref: '#/components/responses/AppResponse'
components:
  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
    PlayerId:
      name: player_id
      in: path
      required: true
      schema:
        type: string
  responses:
    AppResponse:
      description: Semantic result and current application state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AppResponse'
    QuestionResponse:
      description: A question and agent-only judgement context
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/AppResponse'
              - type: object
                properties:
                  question:
                    $ref: '#/components/schemas/Question'
                  judge_context:
                    $ref: '#/components/schemas/JudgeContext'
    AnswerResponse:
      description: A pending answer and judgement context
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/AppResponse'
              - type: object
                properties:
                  answer_id:
                    type: string
                  judge_context:
                    $ref: '#/components/schemas/JudgeContext'
  schemas:
    RegisterPlayerRequest:
      type: object
      required: [user_id, display_name]
      properties:
        user_id:
          type: string
          description: Generic caller-provided user identifier
        display_name:
          type: string
          description: Name shown on the screen
    SubmitAnswerRequest:
      type: object
      required: [user_id, transcript]
      properties:
        user_id:
          type: string
          description: Generic identifier of the answering player
        transcript:
          type: string
          description: Transcribed answer text
    EvaluateAnswerRequest:
      type: object
      required: [answer_right]
      properties:
        answer_right:
          type: boolean
        reason:
          type: string
          description: Short explanation that can be spoken to the user
    AppResponse:
      type: object
      required: [ok, message, user_message, next_action, state]
      properties:
        ok:
          type: boolean
        message:
          type: string
          description: Semantic description for an orchestrator or agent
        user_message:
          type: string
          description: Safe message that can be spoken to a user
        next_action:
          type: object
          properties:
            type:
              type: string
              enum: [speak, listen, wait, render, none]
            text:
              type: string
        state:
          $ref: '#/components/schemas/GameState'
    Question:
      type: object
      required: [id, text]
      properties:
        id:
          type: string
        text:
          type: string
        options:
          type: array
          items:
            type: string
    JudgeContext:
      type: object
      description: Internal context for judging; do not speak before the player answers.
      properties:
        expected_answer:
          type: string
        accepted_answers:
          type: array
          items:
            type: string
        judging_instruction:
          type: string
        player:
          type: string
        transcript:
          type: string
    GameState:
      type: object
      properties:
        session_id:
          type: string
        title:
          type: string
        phase:
          type: string
          enum: [preparing, waiting_start, waiting_answer, evaluating, paused, finished]
        current_question_number:
          type: integer
        total_questions:
          type: integer
        players:
          type: array
          items:
            $ref: '#/components/schemas/Player'
        current_question:
          nullable: true
          $ref: '#/components/schemas/Question'
        pending_answer:
          nullable: true
          type: object
    Player:
      type: object
      required: [player_id, user_id, display_name, ready, score]
      properties:
        player_id:
          type: string
        user_id:
          type: string
        display_name:
          type: string
        registered:
          type: boolean
        ready:
          type: boolean
        score:
          type: integer
