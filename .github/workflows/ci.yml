name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install port inspection dependency
        run: sudo apt-get update && sudo apt-get install -y lsof

      # 四个作用域按顺序执行，共用同一个 Go 构建缓存与依赖，避免重复下载。
      - name: Test casting with coverage
        env:
          PACKAGES: ./cmd/casting/... ./internal/casting/... ./pkg/casting/...
        run: |
          go test $PACKAGES -race -count=1 -covermode=atomic \
            -coverpkg="$(echo "$PACKAGES" | tr ' ' ',')" \
            -coverprofile=coverage-casting.out

      - name: Test gateway with coverage
        env:
          PACKAGES: ./cmd/gateway/... ./internal/gateway/... ./pkg/agentapi/...
        run: |
          go test $PACKAGES -race -count=1 -covermode=atomic \
            -coverpkg="$(echo "$PACKAGES" | tr ' ' ',')" \
            -coverprofile=coverage-gateway.out

      - name: Test render with coverage
        env:
          PACKAGES: ./cmd/render/... ./internal/render/... ./pkg/render/... ./pkg/canvas/...
        run: |
          go test $PACKAGES -race -count=1 -covermode=atomic \
            -coverpkg="$(echo "$PACKAGES" | tr ' ' ',')" \
            -coverprofile=coverage-render.out

      - name: Test voiceentry with coverage
        env:
          PACKAGES: ./cmd/voiceentry/... ./internal/voiceentry/...
        run: |
          go test $PACKAGES -race -count=1 -covermode=atomic \
            -coverpkg="$(echo "$PACKAGES" | tr ' ' ',')" \
            -coverprofile=coverage-voiceentry.out

      - name: Upload casting coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-casting.out
          flags: casting
          name: casting
          fail_ci_if_error: false

      - name: Upload gateway coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-gateway.out
          flags: gateway
          name: gateway
          fail_ci_if_error: false

      - name: Upload render coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-render.out
          flags: render
          name: render
          fail_ci_if_error: false

      - name: Upload voiceentry coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-voiceentry.out
          flags: voiceentry
          name: voiceentry
          fail_ci_if_error: false

  portal:
    name: Portal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Vite 8 要求 Node 20.19+，锁文件由 pnpm 10 生成。
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: portal/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: portal
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: portal
        run: pnpm typecheck

      - name: Test with coverage
        working-directory: portal
        run: pnpm test:coverage

      - name: Upload portal coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./portal/coverage/lcov.info
          flags: portal
          name: portal
          fail_ci_if_error: false

  lint:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run go vet
        run: go vet ./...
