# Open Anywhere 控制面配置示例。
# 复制为 gateway.yaml 后按需修改；gateway.yaml 不会提交到仓库。
# 优先级：命令行 flag > 环境变量 > 本文件 > 内置默认值。
#
# 本文件分三部分：
#   1. 部署项：每次启动都读取，门户模式和独立模式都需要关注。
#   2. 平台配置：AgentAPI、灵矽、MCP、Render、Casting。门户模式下在管理后台
#      /admin/settings 填写即可，下面默认全部注释掉；想用文件做首次初始化时再取消注释，
#      这些值只在数据库对应设置还没有值时写入一次，之后改这里不再生效。
#      独立模式（portal.enabled: false）没有管理后台，必须在这里填 AgentAPI、Render、Casting。

# ---------------------------------------------------------------------------
# 1. 部署项
# ---------------------------------------------------------------------------

# 端口分工见 README 的“端口”表：Gateway 8091、Render 8090、Casting 8080。
# 内置默认值仍是 ":8090"，与 Render 示例端口冲突，所以示例显式改成 8091。
addr: ":8091"

services:
  # 仅本地调试或受信单租户部署使用。设为 true 后允许用户填写 127.0.0.1、局域网等内网
  # Render 地址；生产环境保持 false，否则用户可以借服务绑定探测部署所在内网。
  # 门户模式下管理员保存的平台默认服务也受同一策略约束；本地使用 127.0.0.1
  # 默认地址调试时，需要设为 true。该开关同时放宽 custom 用户的地址校验，
  # 只应在自己信任的单租户环境打开。
  allow_private_targets: false

artifacts:
  dir: "artifacts"
  # Render 下载产物使用的地址，必须指向 Gateway 自己并且是 Render 能访问的绝对 HTTP(S) URL。
  # 示例端口 8091 就是 Gateway 的 addr；不要填 Render 的 8090，Render 会拉不到产物。
  # 局域网或公网部署时换成 http://<Gateway 主机地址>:8091。
  base_url: "http://127.0.0.1:8091"

database:
  path: "open-anywhere.gateway.db"

ports:
  min: 39000
  max: 39999

timeouts:
  build: "60m"
  start: "60s"
  projection: "30s"
  monitor_interval: "5s"
  call: "2m"
  http: "30s"

# public_host：额外放行的 MCP Host（host:port），例如 "203.0.113.10:6004"。灵矽云经隧道或反向代理访问、
# 请求从本机回环地址进来时，MCP 入口只放行配置过的 Host，否则返回 403 invalid Host header。
# 门户模式下管理后台里的公网 MCP 地址会自动放行，通常不用填；独立模式，或代理改写了 Host 时才需要。
# 它是启动时读取的，修改后需要重启。网关直接暴露在公网网卡上时可以留空。
# 另外可选：入口 Bearer token、声纹参数诊断。真实 token 只填 gateway.yaml。
# 门户模式（portal.enabled=true）下不需要填 mcp_token：首次启动自动生成并加密保存，
# 在管理后台 /admin/settings 的“MCP 服务”里可以重新生成。这里的值只用于独立模式，
# 或在门户首次启动时作为初始 token 导入一次。
public_host: ""
mcp_token: ""
speaker_probe: false

# 多租户用户门户（可选）。开启后提供 Home、注册/登录、/portal 用户控制台与 /admin 管理后台。
# 前端需先构建：cd portal && pnpm install && pnpm build。
# portal.username / portal.password 是管理员引导账号：启动时创建或提升为 admin，并激活账号。
portal:
  enabled: false
  data_dir: "portal-data"      # 设备凭证、secret.key 与运行时数据，创建为 0700
  web_dir: "portal/dist"       # Vite 构建产物
  web_embedded: false          # true 时改用编译进二进制的产物（需 -tags portalembed），忽略 web_dir
  username: ""                 # 管理员引导账号，可用 PORTAL_USERNAME 覆盖
  password: ""                 # 管理员引导密码，可用 PORTAL_PASSWORD 覆盖
  session_ttl: "720h"
  cookie_secure: true          # 默认 true；纯 HTTP 本地调试若拿不到 Cookie 再显式改 false
  # 仅在 registration.open 尚无值时把注册开关 seed 为 true；之后以管理后台的设置为准。
  # 开放注册前必须先完成租户隔离：Render 目前没有鉴权与沙箱，MCP 仍是全局 token +
  # 请求头自报身份。未完成隔离就开放注册，等于把跨租户读写暴露给任何注册用户。
  allow_registration: false
  # 平台密钥与用户服务 token 使用 AES-256-GCM 加密。主密钥优先生成在 data_dir/secret.key（0600），
  # 也可用环境变量 GATEWAY_SECRET_KEY（base64 32 字节）提供。密钥必须与数据库一起备份，
  # 丢失后已保存的平台 Key 和用户 token 无法解密。

# 灵矽的部署相关项：提示词文件、开通超时与轮询。
linx:
  system_prompt_file: ""       # 留空使用内置提示词
  provision_timeout: "60s"
  token_poll_interval: "2s"
  token_poll_attempts: 10

# ---------------------------------------------------------------------------
# 2. 平台配置
#    门户模式：默认在 /admin/settings 填写，保持注释即可；文件里的值只在空库首次启动时导入。
#    独立模式：取消注释并填入真实值。
#    不要保留占位值：取消注释后没改的占位值会被当成真实配置写入。
# ---------------------------------------------------------------------------

