<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f7f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e0f11" />
    <title>Open Anywhere</title>
    <script>
      // Resolve the theme before React loads so the first paint is not a white flash.
      (function () {
        try {
          var stored = localStorage.getItem('oa-theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var theme = dark ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
          document.documentElement.style.backgroundColor = dark ? '#0e0f11' : '#f7f7f8'
        } catch (error) {
          // Keep the CSS fallback theme when localStorage is unavailable.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
