<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#efeae1" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#07090c" />
    <title>Open Anywhere</title>
    <script>
      // Resolve the theme before React loads so the first paint is not a white flash.
      (function () {
        try {
          var stored = localStorage.getItem('oa-theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var theme = dark ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
          document.documentElement.style.backgroundColor = dark ? '#07090c' : '#efeae1'
        } catch (error) {
          // Keep the CSS fallback theme when localStorage is unavailable.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
